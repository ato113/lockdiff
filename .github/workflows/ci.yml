name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dist:
    # An action runs the committed dist/, so a stale bundle ships broken code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ does not match the source. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

  self-test:
    # Run the action on this repository's own pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          fail-on-major: false
